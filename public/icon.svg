<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bg)" />

  <!-- Subtle border -->
  <rect x="8" y="8" width="496" height="496" rx="120" fill="none" stroke="#38bdf8" stroke-width="4" stroke-opacity="0.3" />

  <!-- Dynamic Trading Trend Waves -->
  <path d="M 64 360 C 140 380, 180 300, 240 320 C 300 340, 340 220, 448 200" fill="none" stroke="url(#glow)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" opacity="0.6" />
  <path d="M 64 390 C 150 410, 200 340, 280 350 C 360 360, 390 260, 448 240" fill="none" stroke="#2563eb" stroke-width="6" stroke-linecap="round" opacity="0.3" />

  <!-- Central "G" Monogram -->
  <circle cx="256" cy="236" r="110" fill="none" stroke="url(#accent)" stroke-width="32" stroke-linecap="round" />
  <path d="M 256 126 A 110 110 0 1 0 366 236 L 256 236" fill="none" stroke="#ffffff" stroke-width="30" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Trend Arrow Head on G -->
  <polygon points="366,170 366,236 300,236" fill="#10b981" />

  <!-- Subtitle badge: SQUAD -->
  <rect x="160" y="400" width="192" height="40" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.4" />
  <text x="256" y="426" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="900" fill="#38bdf8" letter-spacing="4" text-anchor="middle">G-SQUAD</text>
</svg>
